<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Highway Dodger</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tone.js for procedural arcade sound effects without external audio URLs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #18182b 0%, #090910 100%);
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .font-arcade {
      font-family: 'Orbitron', sans-serif;
    }

    #game-wrapper {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100%;
      max-height: 760px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 25px rgba(56, 189, 248, 0.25);
      border: 2px solid rgba(56, 189, 248, 0.35);
      background: #11131f;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Arcade Button Styles */
    .btn-arcade {
      background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
      border: 2px solid #7dd3fc;
      box-shadow: 0 6px 0 #1d4ed8, 0 10px 20px rgba(6, 182, 212, 0.45);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .btn-arcade:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #1d4ed8, 0 4px 10px rgba(6, 182, 212, 0.45);
    }

    .btn-control {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(6px);
      border: 2px solid rgba(148, 163, 184, 0.35);
      box-shadow: 0 4px 0 rgba(15, 23, 42, 0.9);
      transition: transform 0.06s ease, background-color 0.1s ease;
    }

    .btn-control:active {
      transform: translateY(3px);
      background: rgba(56, 189, 248, 0.35);
      border-color: #38bdf8;
    }
  </style>
</head>
<body class="p-2 sm:p-4">

  <!-- Main Game Container -->
  <div id="game-wrapper" class="flex flex-col">
    
    <!-- Top HUD Bar -->
    <div class="absolute top-0 left-0 right-0 z-20 flex items-center justify-between px-4 py-3 bg-gradient-to-b from-slate-950/90 to-transparent pointer-events-none">
      <div class="bg-slate-900/80 border border-cyan-500/30 rounded-xl px-3 py-1.5 backdrop-blur-sm">
        <div class="text-[10px] uppercase tracking-wider text-cyan-400 font-semibold">Score</div>
        <div id="score-display" class="font-arcade text-xl sm:text-2xl font-extrabold text-white leading-none">0</div>
      </div>

      <div class="flex items-center gap-2 pointer-events-auto">
        <!-- Sound Toggle -->
        <button id="sound-btn" aria-label="Toggle Sound" class="bg-slate-900/85 hover:bg-slate-800 border border-slate-700 rounded-xl p-2 text-cyan-400 transition">
          <svg id="sound-on-icon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14" />
          </svg>
          <svg id="sound-off-icon" class="w-5 h-5 hidden text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6" />
          </svg>
        </button>

        <div class="bg-slate-900/80 border border-amber-500/30 rounded-xl px-3 py-1.5 backdrop-blur-sm text-right">
          <div class="text-[10px] uppercase tracking-wider text-amber-400 font-semibold">Best</div>
          <div id="best-display" class="font-arcade text-xl sm:text-2xl font-extrabold text-amber-300 leading-none">0</div>
        </div>
      </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Start / Game Over Overlay -->
    <div id="overlay" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-slate-950/80 backdrop-blur-sm p-6 text-center transition-opacity duration-200">
      <div class="mb-2 inline-block px-3 py-1 rounded-full bg-cyan-500/15 border border-cyan-400/30 text-cyan-300 text-xs font-semibold tracking-widest uppercase">
        Arcade Traffic Racer
      </div>
      <h1 id="overlay-title" class="font-arcade text-3xl sm:text-4xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-sky-400 to-indigo-400 mb-3">
        NEON DODGER
      </h1>
      <p id="overlay-subtitle" class="text-slate-300 text-sm sm:text-base max-w-xs mb-6">
        Weave through oncoming highway traffic. Survive longer to rack up higher points!
      </p>

      <!-- Final Score Card (shown on Game Over) -->
      <div id="final-stats" class="hidden w-full max-w-xs bg-slate-900/90 border border-slate-700/80 rounded-2xl p-4 mb-6 shadow-inner">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <div class="text-xs text-slate-400 uppercase">Final Score</div>
            <div id="final-score" class="font-arcade text-2xl font-bold text-white mt-0.5">0</div>
          </div>
          <div>
            <div class="text-xs text-amber-400 uppercase">High Score</div>
            <div id="final-best" class="font-arcade text-2xl font-bold text-amber-300 mt-0.5">0</div>
          </div>
        </div>
      </div>

      <button id="start-btn" class="btn-arcade font-arcade text-white font-extrabold text-lg px-8 py-3.5 rounded-2xl tracking-wider uppercase cursor-pointer">
        START ENGINE
      </button>

      <div class="mt-6 text-xs text-slate-400 flex items-center justify-center gap-4">
        <span>⌨️ <kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 text-slate-200">←</kbd> <kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 text-slate-200">→</kbd> or <kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 text-slate-200">A</kbd> <kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 text-slate-200">D</kbd></span>
        <span>📱 Tap or Swipe</span>
      </div>
    </div>

    <!-- Bottom Touch Controls (Outside Canvas Area / Overlay Bar at Bottom) -->
    <div id="touch-controls" class="absolute bottom-3 left-3 right-3 z-20 flex justify-between gap-3 sm:opacity-85">
      <button id="btn-left" aria-label="Move Left" class="btn-control flex-1 py-3.5 rounded-2xl flex items-center justify-center text-white active:text-cyan-300">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>
      <button id="btn-right" aria-label="Move Right" class="btn-control flex-1 py-3.5 rounded-2xl flex items-center justify-center text-white active:text-cyan-300">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>

  </div>

  <script>
    /**
     * NEON HIGHWAY DODGER
     * Single-file HTML5 Canvas traffic dodging game with responsive scaling,
     * keyboard/touch/swipe controls, particle effects, and Tone.js synth audio.
     */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('game-wrapper');

    // UI Elements
    const scoreDisplay = document.getElementById('score-display');
    const bestDisplay = document.getElementById('best-display');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySubtitle = document.getElementById('overlay-subtitle');
    const finalStats = document.getElementById('final-stats');
    const finalScoreEl = document.getElementById('final-score');
    const finalBestEl = document.getElementById('final-best');
    const startBtn = document.getElementById('start-btn');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const soundBtn = document.getElementById('sound-btn');
    const soundOnIcon = document.getElementById('sound-on-icon');
    const soundOffIcon = document.getElementById('sound-off-icon');

    // Game Configuration
    const LANE_COUNT = 3;
    let width = 0;
    let height = 0;
    let laneWidth = 0;
    let roadMargin = 24;

    // Game State
    let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER'
    let score = 0;
    let highScore = 0;
    let speed = 5;
    let roadOffset = 0;
    let spawnTimer = 0;
    let spawnInterval = 75;
    let animationId = null;
    let soundEnabled = true;

    // Load saved high score safely
    try {
      const saved = localStorage.getItem('neon_dodger_best');
      if (saved) highScore = parseInt(saved, 10) || 0;
    } catch (e) {
      highScore = 0;
    }
    bestDisplay.textContent = highScore;

    // Player Object
    const player = {
      lane: 1, // 0 = left, 1 = center, 2 = right
      x: 0,
      y: 0,
      targetX: 0,
      width: 48,
      height: 86,
      tilt: 0
    };

    // Traffic & Visual Effects Arrays
    let enemies = [];
    let particles = [];
    let floatingTexts = [];

    // Enemy Car Palettes
    const ENEMY_STYLES = [
      { body: '#ef4444', accent: '#fca5a5', roof: '#991b1b' }, // Crimson Racer
      { body: '#f59e0b', accent: '#fde68a', roof: '#b45309' }, // Amber Taxi
      { body: '#a855f7', accent: '#e9d5ff', roof: '#6b21a8' }, // Purple Coupe
      { body: '#10b981', accent: '#a7f3d0', roof: '#065f46' }  // Emerald Sedan
    ];

    // --- SOUND ENGINE (Tone.js) ---
    let synth = null;
    let crashNoise = null;

    function initAudio() {
      if (synth || typeof Tone === 'undefined') return;
      try {
        synth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: 'triangle' },
          envelope: { attack: 0.01, decay: 0.1, sustain: 0.05, release: 0.1 }
        }).toDestination();
        synth.volume.value = -10;

        crashNoise = new Tone.NoiseSynth({
          noise: { type: 'brown' },
          envelope: { attack: 0.01, decay: 0.35, sustain: 0, release: 0.1 }
        }).toDestination();
        crashNoise.volume.value = -6;
      } catch (err) {
        console.warn('Audio init skipped:', err);
      }
    }

    function playSound(type) {
      if (!soundEnabled || !synth) return;
      try {
        if (Tone.context.state !== 'running') {
          Tone.start();
        }
        if (type === 'move') {
          synth.triggerAttackRelease('C5', '32n');
        } else if (type === 'score') {
          synth.triggerAttackRelease('E5', '16n');
        } else if (type === 'crash') {
          crashNoise.triggerAttackRelease('8n');
          synth.triggerAttackRelease(['C2', 'F#2'], '4n');
        }
      } catch (e) {}
    }

    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundOnIcon.classList.toggle('hidden', !soundEnabled);
      soundOffIcon.classList.toggle('hidden', soundEnabled);
    });

    // --- RESPONSIVE CANVAS SIZING ---
    function resizeCanvas() {
      const rect = wrapper.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      canvas.width = width;
      canvas.height = height;

      roadMargin = Math.max(18, width * 0.06);
      const roadWidth = width - roadMargin * 2;
      laneWidth = roadWidth / LANE_COUNT;

      // Scale car dimensions proportionally to lane width
      player.width = Math.min(54, laneWidth * 0.56);
      player.height = player.width * 1.78;
      player.y = height - player.height - 86; // Leave room for bottom touch controls
      player.targetX = getLaneCenterX(player.lane);

      if (gameState !== 'PLAYING') {
        player.x = player.targetX;
      }
    }

    function getLaneCenterX(laneIndex) {
      return roadMargin + laneWidth * laneIndex + laneWidth / 2;
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      if (gameState !== 'PLAYING') drawScene();
    });

    // --- INPUT HANDLING (Keyboard, Touch Buttons, Swipe) ---
    function moveLeft() {
      if (gameState !== 'PLAYING') return;
      if (player.lane > 0) {
        player.lane--;
        player.targetX = getLaneCenterX(player.lane);
        player.tilt = -0.18;
        playSound('move');
      }
    }

    function moveRight() {
      if (gameState !== 'PLAYING') return;
      if (player.lane < LANE_COUNT - 1) {
        player.lane++;
        player.targetX = getLaneCenterX(player.lane);
        player.tilt = 0.18;
        playSound('move');
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        e.preventDefault();
        moveLeft();
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        e.preventDefault();
        moveRight();
      } else if ((e.key === ' ' || e.key === 'Enter') && gameState !== 'PLAYING') {
        e.preventDefault();
        startGame();
      }
    });

    btnLeft.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      moveLeft();
    });

    btnRight.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      moveRight();
    });

    // Swipe support directly on the canvas
    let touchStartX = 0;
    canvas.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].clientX;
    }, { passive: true });

    canvas.addEventListener('touchend', (e) => {
      if (gameState !== 'PLAYING') return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 25) {
        if (dx < 0) moveLeft();
        else moveRight();
      } else {
        // Tap left or right side of screen
        const tapX = e.changedTouches[0].clientX - wrapper.getBoundingClientRect().left;
        if (tapX < width / 2) moveLeft();
        else moveRight();
      }
    }, { passive: true });

    // --- GAME LIFECYCLE ---
    function startGame() {
      initAudio();
      if (typeof Tone !== 'undefined' && Tone.context.state !== 'running') {
        Tone.start().catch(() => {});
      }

      resizeCanvas();
      score = 0;
      speed = Math.max(5.5, height * 0.0085);
      spawnTimer = 0;
      spawnInterval = 72;
      enemies = [];
      particles = [];
      floatingTexts = [];

      player.lane = 1;
      player.x = getLaneCenterX(1);
      player.targetX = player.x;
      player.tilt = 0;

      scoreDisplay.textContent = '0';
      overlay.classList.add('opacity-0', 'pointer-events-none');
      gameState = 'PLAYING';
    }

    function triggerGameOver() {
      gameState = 'GAMEOVER';
      playSound('crash');
      createExplosion(player.x, player.y + player.height / 2, '#38bdf8');
      createExplosion(player.x, player.y + player.height / 2, '#f43f5e');

      if (score > highScore) {
        highScore = score;
        bestDisplay.textContent = highScore;
        try {
          localStorage.setItem('neon_dodger_best', highScore.toString());
        } catch (e) {}
      }

      overlayTitle.textContent = 'WRECKED!';
      overlaySubtitle.textContent = 'Watch out for sudden lane blockers!';
      finalScoreEl.textContent = score;
      finalBestEl.textContent = highScore;
      finalStats.classList.remove('hidden');
      startBtn.textContent = 'RACE AGAIN';

      setTimeout(() => {
        overlay.classList.remove('opacity-0', 'pointer-events-none');
      }, 450);
    }

    startBtn.addEventListener('click', startGame);

    // --- SPAWNING & PARTICLES ---
    function spawnEnemyWave() {
      // Decide whether to spawn 1 or 2 cars (never block all 3 lanes!)
      const maxBlock = score >= 15 && Math.random() < 0.45 ? 2 : 1;
      const availableLanes = [0, 1, 2];

      for (let i = 0; i < maxBlock; i++) {
        const randIdx = Math.floor(Math.random() * availableLanes.length);
        const lane = availableLanes.splice(randIdx, 1)[0];
        const style = ENEMY_STYLES[Math.floor(Math.random() * ENEMY_STYLES.length)];
        const carW = player.width;
        const carH = player.height * (0.95 + Math.random() * 0.15);

        enemies.push({
          lane,
          x: getLaneCenterX(lane),
          y: -carH - 20,
          width: carW,
          height: carH,
          speedOffset: (Math.random() - 0.3) * 1.4,
          style,
          passed: false
        });
      }
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 24; i++) {
        const angle = Math.random() * Math.PI * 2;
        const velocity = 2 + Math.random() * 6;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * velocity,
          vy: Math.sin(angle) * velocity,
          size: 3 + Math.random() * 4,
          color,
          alpha: 1
        });
      }
    }

    function addFloatingText(x, y, text) {
      floatingTexts.push({
        x,
        y,
        text,
        alpha: 1
      });
    }

    // --- UPDATE LOOP ---
    function update() {
      if (gameState === 'PLAYING') {
        // Scroll road markings
        roadOffset = (roadOffset + speed) % 60;

        // Smooth lane transition & car tilt recovery
        player.x += (player.targetX - player.x) * 0.22;
        player.tilt *= 0.85;

        // Gradually increase difficulty
        speed += 0.0022;
        spawnInterval = Math.max(36, 74 - score * 0.45);

        // Spawn traffic
        spawnTimer++;
        if (spawnTimer >= spawnInterval) {
          spawnTimer = 0;
          spawnEnemyWave();
        }

        // Update enemy cars
        for (let i = enemies.length - 1; i >= 0; i--) {
          const enemy = enemies[i];
          enemy.y += speed + enemy.speedOffset;

          // Score point when safely passing enemy
          if (!enemy.passed && enemy.y > player.y + player.height * 0.7) {
            enemy.passed = true;
            score += 1;
            scoreDisplay.textContent = score;
            playSound('score');
            addFloatingText(player.x, player.y - 10, '+1');
          }

          // Forgiving AABB collision check (slight hitbox padding feels fair)
          const padX = player.width * 0.16;
          const padY = player.height * 0.12;
          if (
            player.x - player.width / 2 + padX < enemy.x + enemy.width / 2 - padX &&
            player.x + player.width / 2 - padX > enemy.x - enemy.width / 2 + padX &&
            player.y + padY < enemy.y + enemy.height - padY &&
            player.y + player.height - padY > enemy.y + padY
          ) {
            triggerGameOver();
            break;
          }

          // Remove offscreen cars
          if (enemy.y > height + 120) {
            enemies.splice(i, 1);
          }
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.025;
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      // Update floating score popups
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 1.4;
        ft.alpha -= 0.03;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
      }
    }

    // --- RENDERING ---
    function drawCar(x, y, w, h, colors, isPlayer = false, tilt = 0) {
      ctx.save();
      ctx.translate(x, y + h / 2);
      ctx.rotate(tilt);

      const hw = w / 2;
      const hh = h / 2;

      // Ground shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.beginPath();
      ctx.roundRect(-hw + 3, -hh + 6, w, h, 12);
      ctx.fill();

      // Tires
      ctx.fillStyle = '#090d16';
      const tireW = 5;
      const tireH = h * 0.22;
      ctx.fillRect(-hw - 3, -hh + h * 0.14, tireW, tireH);
      ctx.fillRect(hw - 2, -hh + h * 0.14, tireW, tireH);
      ctx.fillRect(-hw - 3, hh - h * 0.36, tireW, tireH);
      ctx.fillRect(hw - 2, hh - h * 0.36, tireW, tireH);

      // Car Chassis
      ctx.fillStyle = colors.body;
      ctx.beginPath();
      ctx.roundRect(-hw, -hh, w, h, 11);
      ctx.fill();

      // Racing Stripe / Trim
      ctx.fillStyle = colors.accent;
      ctx.fillRect(-w * 0.08, -hh + 2, w * 0.16, h - 4);

      // Cabin / Roof
      ctx.fillStyle = colors.roof;
      ctx.beginPath();
      ctx.roundRect(-hw * 0.76, -hh * 0.45, w * 0.76, h * 0.52, 7);
      ctx.fill();

      // Windshield
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      if (isPlayer) {
        ctx.roundRect(-hw * 0.68, -hh * 0.42, w * 0.68, h * 0.18, 4);
      } else {
        ctx.roundRect(-hw * 0.68, hh * 0.18, w * 0.68, h * 0.18, 4);
      }
      ctx.fill();

      // Headlights & Taillights
      if (isPlayer) {
        // Headlight beams
        const beamGrad = ctx.createLinearGradient(0, -hh, 0, -hh - 55);
        beamGrad.addColorStop(0, 'rgba(186, 230, 253, 0.45)');
        beamGrad.addColorStop(1, 'rgba(186, 230, 253, 0)');
        ctx.fillStyle = beamGrad;
        ctx.beginPath();
        ctx.moveTo(-hw * 0.75, -hh);
        ctx.lineTo(-hw * 1.25, -hh - 55);
        ctx.lineTo(hw * 1.25, -hh - 55);
        ctx.lineTo(hw * 0.75, -hh);
        ctx.closePath();
        ctx.fill();

        // Front lights
        ctx.fillStyle = '#e0f2fe';
        ctx.fillRect(-hw * 0.78, -hh + 1, w * 0.24, 4);
        ctx.fillRect(hw * 0.54, -hh + 1, w * 0.24, 4);

        // Rear neon taillights
        ctx.fillStyle = '#f43f5e';
        ctx.fillRect(-hw * 0.78, hh - 4, w * 0.26, 3);
        ctx.fillRect(hw * 0.52, hh - 4, w * 0.26, 3);
      } else {
        // Oncoming headlights facing down
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(-hw * 0.78, hh - 4, w * 0.24, 4);
        ctx.fillRect(hw * 0.54, hh - 4, w * 0.24, 4);
      }

      ctx.restore();
    }

    function drawScene() {
      // Background shoulder
      ctx.fillStyle = '#0b0e17';
      ctx.fillRect(0, 0, width, height);

      // Asphalt Road
      const roadWidth = width - roadMargin * 2;
      ctx.fillStyle = '#181c2c';
      ctx.fillRect(roadMargin, 0, roadWidth, height);

      // Neon Road Edge Rails
      ctx.fillStyle = '#06b6d4';
      ctx.fillRect(roadMargin - 3, 0, 3, height);
      ctx.fillRect(width - roadMargin, 0, 3, height);

      // Dashed Lane Dividers
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
      ctx.lineWidth = 3;
      ctx.setLineDash([30, 30]);
      ctx.lineDashOffset = -roadOffset;

      for (let i = 1; i < LANE_COUNT; i++) {
        const lineX = roadMargin + laneWidth * i;
        ctx.beginPath();
        ctx.moveTo(lineX, 0);
        ctx.lineTo(lineX, height);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // Draw Enemy Traffic
      for (const enemy of enemies) {
        drawCar(enemy.x, enemy.y, enemy.width, enemy.height, enemy.style, false, 0);
      }

      // Draw Player Car (unless wrecked)
      if (gameState !== 'GAMEOVER') {
        drawCar(
          player.x,
          player.y,
          player.width,
          player.height,
          { body: '#0284c7', accent: '#38bdf8', roof: '#0369a1' },
          true,
          player.tilt
        );
      }

      // Draw Explosion Particles
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Draw Floating "+1" Score Popups
      ctx.font = '800 18px Orbitron, sans-serif';
      ctx.textAlign = 'center';
      for (const ft of floatingTexts) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ft.alpha);
        ctx.fillStyle = '#38bdf8';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      }
    }

    function gameLoop() {
      update();
      drawScene();
      animationId = requestAnimationFrame(gameLoop);
    }

    // Initialize on window load
    window.onload = function () {
      resizeCanvas();
      drawScene();
      gameLoop();
    };
  </script>
</body>
</html>
